    <text x="714" y="91" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1.5">BUILDING</text>
    <text x="700" y="124" font-size="15.5" fill="#c3cde6"><tspan fill="#34d399">›</tspan>  Client platforms at LoopFound</text>
    <text x="700" y="150" font-size="15.5" fill="#c3cde6"><tspan fill="#34d399">›</tspan>  P2PSkill — skill exchange</text>
    <text x="700" y="176" font-size="15.5" fill="#c3cde6"><tspan fill="#34d399">›</tspan>  AI agent orchestration</text>
