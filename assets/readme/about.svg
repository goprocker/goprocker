    <text x="196" y="340" font-size="15" font-weight="700" fill="#e6edf3">CSE · AI</text></g>
    <g><rect x="324" y="284" width="132" height="76" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="338" y="284" width="24" height="3" rx="1.5" fill="#34d399"/>
