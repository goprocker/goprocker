    <text x="714" y="255" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="1.5">LEARNING</text>
    <text x="700" y="288" font-size="15.5" fill="#c3cde6"><tspan fill="#a78bfa">›</tspan>  LLM agents · computer vision</text>
