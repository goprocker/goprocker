<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="About Gopinath: CS and AI engineering student in Chennai, co-founder of LoopFound, building web platforms and multi-agent AI tools.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="#080c1a"/></linearGradient>
    <radialGradient id="o" cx="0" cy="1" r="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".2"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#a5c4ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <style>.in{animation:in .6s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(8px)}}</style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="399" rx="18" fill="url(#g)" stroke="#ffffff" stroke-opacity=".09"/>
  <rect x=".5" y=".5" width="1199" height="399" rx="18" fill="url(#o)"/>
  <g font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif">
    <text x="40" y="62" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#70a5fd">const gopinath = () =&gt; ship();</text>
    <text x="40" y="112" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-.6">I'd rather <tspan fill="url(#hl)">ship</tspan> than talk</text>
    <text x="40" y="152" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-.6">about shipping.</text>
    <text x="40" y="196" font-size="16.5" fill="#97a3c2">CS &amp; AI Engineering student who co-founded LoopFound, a web</text>
    <text x="40" y="221" font-size="16.5" fill="#97a3c2">agency building production sites for real businesses. Outside</text>
    <text x="40" y="246" font-size="16.5" fill="#97a3c2">client work I build multi-agent AI tools at hackathons and in OSS.</text>
    <g><rect x="40" y="284" width="132" height="76" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/>
