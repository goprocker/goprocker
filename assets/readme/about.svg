    <text x="338" y="340" font-size="15" font-weight="700" fill="#e6edf3">LoopFound</text></g>
    <g><rect x="466" y="284" width="132" height="76" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/>
